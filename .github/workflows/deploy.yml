# Builds both images and deploys them to Cloud Run on every push to main.
# One-time Google Cloud setup and the repository variables it needs: deploy/README.md.
# Until GCP_PROJECT_ID is set as a repository variable, this workflow skips itself.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  # Public OAuth client id: it identifies the app, it does not grant access.
  GOOGLE_CLIENT_ID: 42634988358-smce93h2vqaiho07k1brjftaa704n33q.apps.googleusercontent.com

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job sign in to Google Cloud without a stored key
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: firecalc-deploy@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Work out names and URLs
        run: |
          # The provider path is projects/<number>/locations/global/..., and Cloud Run's
          # stable URLs are https://<service>-<project number>.<region>.run.app.
          number=$(cut -d/ -f2 <<< "${{ vars.GCP_WIF_PROVIDER }}")
          registry="$REGION-docker.pkg.dev/$PROJECT_ID/firecalc"
          {
            echo "API_IMAGE=$registry/api:$GITHUB_SHA"
            echo "WEB_IMAGE=$registry/web:$GITHUB_SHA"
            echo "API_URL=https://firecalc-api-$number.$REGION.run.app"
            echo "WEB_HOST=firecalc-web-$number.$REGION.run.app"
          } >> "$GITHUB_ENV"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push images
        run: |
          docker build -t "$API_IMAGE" backend
          docker build -t "$WEB_IMAGE" frontend
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"

      - name: Deploy API
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          # One Auth__AllowedEmails__<n> variable per comma-separated address.
          vars="Auth__GoogleClientId=$GOOGLE_CLIENT_ID"
          i=0
          for email in ${ALLOWED_EMAILS//,/ }; do
            vars="$vars;Auth__AllowedEmails__$i=$email"
            i=$((i + 1))
          done
          # Private: only the web service's identity may call it.
          gcloud run deploy firecalc-api \
            --image="$API_IMAGE" \
            --region="$REGION" \
            --service-account="firecalc-api@$PROJECT_ID.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --set-env-vars="^;^$vars" \
            --set-secrets=ConnectionStrings__Default=firecalc-db:latest \
            --min-instances=0 --max-instances=1 \
            --cpu=1 --memory=512Mi --cpu-boost \
            --quiet

      - name: Deploy web
        run: |
          gcloud run deploy firecalc-web \
            --image="$WEB_IMAGE" \
            --region="$REGION" \
            --service-account="firecalc-web@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --set-env-vars="^;^API_URL=$API_URL;API_AUDIENCE=$API_URL;GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID;NG_ALLOWED_HOSTS=$WEB_HOST" \
            --min-instances=0 --max-instances=2 \
            --cpu=1 --memory=512Mi --cpu-boost \
            --quiet
          echo "Live at https://$WEB_HOST" >> "$GITHUB_STEP_SUMMARY"
