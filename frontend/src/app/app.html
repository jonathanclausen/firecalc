<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" />
        <path d="M8 22 L13.5 15.5 L17.5 19 L24 10.5" />
        <path d="M19.5 10.5 H24 V15" />
      </svg>
      <span>FireCalc</span>
    </a>

    <nav class="nav" aria-label="Main">
      <a routerLink="/compound-interest" routerLinkActive="active">Compound interest</a>
      <span class="nav__soon" title="Coming soon">Scenarios <em>Soon</em></span>
      <span class="nav__soon" title="Coming soon">Tracking <em>Soon</em></span>
    </nav>

    <label class="currency">
      <span class="visually-hidden">Currency</span>
      <select (change)="currency.select($any($event.target).value)">
        @for (c of currencies; track c.code) {
          <option [value]="c.code" [selected]="c.code === currency.current().code">
            {{ c.code }} · {{ c.label }}
          </option>
        }
      </select>
    </label>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<footer class="footer">
  Projections assume a constant return and are estimates, not financial advice.
</footer>
