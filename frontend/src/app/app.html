@let t = i18n.t();
@if (!appShell()) {
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" routerLink="/">
        <app-brand-mark />
        <span>MinFormue</span>
      </a>

      <nav class="nav" [attr.aria-label]="t.nav.main">
        <a routerLink="/compound-interest" routerLinkActive="active">{{
          t.nav.compoundInterest
        }}</a>
        <a routerLink="/planner" routerLinkActive="active">{{ t.nav.planner }}</a>
        <span class="nav__soon" [title]="t.nav.comingSoon">
          {{ t.nav.scenarios }} <em>{{ t.nav.soon }}</em>
        </span>
      </nav>

      <div class="settings">
        <app-lang-switch />

        <label class="currency">
          <span class="visually-hidden">{{ t.currency }}</span>
          <select (change)="currency.select($any($event.target).value)">
            @for (c of currencies; track c.code) {
              <option [value]="c.code" [selected]="c.code === currency.current().code">
                {{ c.code }} · {{ t.currencies[c.code] }}
              </option>
            }
          </select>
        </label>
      </div>
    </div>
  </header>
}

<main class="page" [class.page--app]="appShell()">
  <router-outlet />
</main>

@if (!appShell()) {
  <footer class="footer">{{ t.footer }}</footer>
}
