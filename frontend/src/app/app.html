@let t = i18n.t();
<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" />
        <path d="M8 22 L13.5 15.5 L17.5 19 L24 10.5" />
        <path d="M19.5 10.5 H24 V15" />
      </svg>
      <span>FireCalc</span>
    </a>

    <nav class="nav" [attr.aria-label]="t.nav.main">
      <a routerLink="/compound-interest" routerLinkActive="active">{{ t.nav.compoundInterest }}</a>
      <a routerLink="/planner" routerLinkActive="active">{{ t.nav.planner }}</a>
      <span class="nav__soon" [title]="t.nav.comingSoon">
        {{ t.nav.scenarios }} <em>{{ t.nav.soon }}</em>
      </span>
    </nav>

    <div class="settings">
      <div class="lang" role="group" [attr.aria-label]="t.language">
        @for (l of i18n.languages; track l.code) {
          <button
            type="button"
            [class.active]="i18n.lang() === l.code"
            [attr.aria-pressed]="i18n.lang() === l.code"
            [attr.lang]="l.code"
            [title]="l.label"
            (click)="i18n.set(l.code)"
          >
            {{ l.code.toUpperCase() }}
          </button>
        }
      </div>

      <label class="currency">
        <span class="visually-hidden">{{ t.currency }}</span>
        <select (change)="currency.select($any($event.target).value)">
          @for (c of currencies; track c.code) {
            <option [value]="c.code" [selected]="c.code === currency.current().code">
              {{ c.code }} · {{ t.currencies[c.code] }}
            </option>
          }
        </select>
      </label>
    </div>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<footer class="footer">{{ t.footer }}</footer>
